<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support</title>
    <!-- Icons के लिए FontAwesome लिंक -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .header {
            background-color: #0056b3;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .header p {
            margin-top: 10px;
            font-size: 16px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        /* Contact Cards CSS */
        .contact-methods {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .contact-card {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .contact-card:hover {
            transform: translateY(-5px);
        }
        .contact-card i {
            font-size: 30px;
            margin-bottom: 15px;
        }
        .icon-call { color: #007bff; }
        .icon-whatsapp { color: #25D366; }
        .icon-email { color: #ea4335; }
        
        .contact-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .contact-card a {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            font-size: 16px;
        }
        .contact-card a:hover {
            color: #000;
        }

        /* Leave a Message Form CSS */
        .message-form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .message-form-container h2 {
            margin-top: 0;
            color: #0056b3;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #007bff;
            outline: none;
        }
        .submit-btn {
            background-color: #0056b3;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #004494;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>Help & Support</h1>
        <p>हमसे संपर्क करें, हमें आपकी सहायता करने में खुशी होगी।</p>
    </div>

    <div class="container">
        
        <!-- Quick Contact Methods (Call, WhatsApp, Email) -->
        <div class="contact-methods">
            <!-- Helpline Card -->
            <div class="contact-card">
                <i class="fas fa-phone-alt icon-call"></i>
                <h3>Helpline Number</h3>
                <!-- tel: टैग से सीधे कॉल लगेगी -->
                <a href="tel:+916204617401">+91 6204617401</a>
            </div>

            <!-- WhatsApp Card -->
            <div class="contact-card">
                <i class="fab fa-whatsapp icon-whatsapp"></i>
                <h3>WhatsApp Us</h3>
                <!-- wa.me लिंक से सीधे WhatsApp चैट खुलेगी -->
                <a href="https://wa.me/916204617401" target="_blank">+91 6204617401</a>
            </div>

            <!-- Email Card -->
            <div class="contact-card">
                <i class="fas fa-envelope icon-email"></i>
                <h3>Email Us</h3>
                <!-- mailto: टैग से सीधा ईमेल ऐप खुलेगा -->
                <a href="mailto:arunas.as99@gmail.com">arunas.as99@gmail.com</a>
            </div>
        </div>

        <!-- Leave a Message Form -->
        <div class="message-form-container">
            <h2><i class="fas fa-comment-dots"></i> Leave a Message</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Full Name (पूरा नाम)</label>
                    <input type="text" id="name" name="name" placeholder="अपना नाम दर्ज करें" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number (मोबाइल नंबर)</label>
                    <input type="tel" id="phone" name="phone" placeholder="अपना मोबाइल नंबर दर्ज करें" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message (आपका संदेश)</label>
                    <textarea id="message" name="message" rows="5" placeholder="आपकी समस्या या सवाल यहाँ विस्तार से लिखें..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <!-- Back to Home Link -->
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        
    </div>

</body>
</html>
