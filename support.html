<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support - InstaFix</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #bf6a1f; --bg-color: #f4f4f4; --white: #ffffff; --text-dark: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Devanagari', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); }
        
        header { background-color: var(--white); padding: 15px 5%; display: flex; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* 🌟 New Professional Back Button CSS */
        .back-btn { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background-color: #f0f0f0; border-radius: 50%; text-decoration: none; color: var(--primary-color); margin-right: 15px; transition: 0.3s; }
        .back-btn:hover { background-color: var(--primary-color); color: white; box-shadow: 0 2px 8px rgba(191, 106, 31, 0.4); }
        .back-btn svg { width: 22px; height: 22px; fill: currentColor; }
        
        .page-title { font-size: 20px; font-weight: 700; color: var(--text-dark); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        
        .contact-methods { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
        .contact-card { flex: 1; min-width: 250px; background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; }
        .contact-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .contact-card i { font-size: 40px; margin-bottom: 15px; }
        .icon-call { color: #007bff; } .icon-whatsapp { color: #25D366; } .icon-email { color: #ea4335; }
        .contact-card h3 { font-size: 18px; margin-bottom: 10px; }
        .contact-card a { text-decoration: none; color: #333; font-weight: bold; font-size: 16px; }

        .message-form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .message-form-container h2 { color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid #f4f4f4; padding-bottom: 10px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fafafa;}
        input:focus, textarea:focus { border-color: var(--primary-color); outline: none; background: white;}
        .submit-btn { background-color: var(--primary-color); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
        .submit-btn:hover { background-color: #a35817; }
    </style>
</head>
<body>

    <header>
        <!-- 🌟 New SVG Back Button -->
        <a href="index.html" class="back-btn" title="होम पर जाएँ">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="page-title">Help & Support</div>
    </header>

    <div class="container">
        <div style="text-align: center; margin-bottom: 30px;">
            <p>हमसे संपर्क करें, हमें आपकी सहायता करने में खुशी होगी।</p>
        </div>

        <div class="contact-methods">
            <div class="contact-card">
                <i class="fas fa-phone-alt icon-call"></i>
                <h3>Call Us</h3>
                <a href="tel:+916204617401">+91 6204617401</a>
            </div>
            <div class="contact-card">
                <i class="fab fa-whatsapp icon-whatsapp"></i>
                <h3>WhatsApp</h3>
                <a href="https://wa.me/916204617401" target="_blank">+91 6204617401</a>
            </div>
            <div class="contact-card">
                <i class="fas fa-envelope icon-email"></i>
                <h3>Email</h3>
                <a href="mailto:arunas.as99@gmail.com">arunas.as99@gmail.com</a>
            </div>
        </div>

        <div class="message-form-container">
            <h2><i class="fas fa-comment-dots"></i> हमें मैसेज भेजें</h2>
            <form>
                <div class="form-group">
                    <label>पूरा नाम</label>
                    <input type="text" placeholder="अपना नाम दर्ज करें" required>
                </div>
                <div class="form-group">
                    <label>मोबाइल नंबर</label>
                    <input type="tel" placeholder="अपना मोबाइल नंबर दर्ज करें" required>
                </div>
                <div class="form-group">
                    <label>आपका संदेश</label>
                    <textarea rows="4" placeholder="आपकी समस्या या सवाल यहाँ विस्तार से लिखें..." required></textarea>
                </div>
                <button type="submit" class="submit-btn" onclick="alert('आपका संदेश भेज दिया गया है!');">Send Message</button>
            </form>
        </div>
    </div>

</body>
</html>
