<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaFix - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary-color: #bf6a1f; --bg-color: #f4f4f4; --white: #ffffff; --text-dark: #222222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Devanagari', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); }
        header { background-color: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo-section { font-size: 24px; font-weight: 700; color: var(--primary-color); text-decoration: none; }
        .header-links a { color: #4a148c; text-decoration: none; font-size: 15px; font-weight: 600; margin-left: 15px; transition: 0.3s; }
        .header-links a:hover { color: var(--primary-color); }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; margin-top: 20px; }
        .service-card { background: white; padding: 25px 15px; border-radius: 12px; text-align: center; border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .service-card:hover:not(.disabled) { border-color: var(--primary-color); transform: translateY(-5px); box-shadow: 0 6px 15px rgba(191, 106, 31, 0.15); }
        .service-card i { font-size: 35px; display: block; margin-bottom: 12px; }
        .service-card .title { font-size: 15px; font-weight: 600; }
        .service-card.disabled { cursor: not-allowed; background-color: #f9f9f9; opacity: 0.7; }
        .coming-soon-badge { position: absolute; top: -10px; right: -5px; background-color: #e53935; color: white; font-size: 10px; font-weight: 700; padding: 5px 8px; border-radius: 20px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); text-transform: uppercase; }
        #loadingMsg { text-align: center; margin-top: 50px; font-weight: bold; color: #555; }
        @media (min-width: 768px) { .services-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 30px; } .service-card { padding: 35px 20px; } .service-card i { font-size: 45px; } }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-section">InstaFix</a>
        <div class="header-links">
            <a href="status.html">स्टेटस</a>
            <a href="support.html">सपोर्ट</a>
        </div>
    </header>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 20px; font-size: 22px;">अपनी सर्विस चुनें</h2>
        <div id="loadingMsg">⏳ सर्विसेस लोड हो रही हैं...</div>
        <div class="services-grid" id="servicesGrid"></div>
    </div>

<script>
    // Firebase Configuration
    const firebaseConfig = { apiKey: "AIzaSyAgLeGVoD-i2EmVtzZaYKNfVKELayJgqno", authDomain: "instafix-a2b64.firebaseapp.com", projectId: "instafix-a2b64", storageBucket: "instafix-a2b64.firebasestorage.app", messagingSenderId: "601923931749", appId: "1:601923931749:web:937f65656afcc0ab8d808c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const defaultServices = [
        { id: 'furniture', name: 'फर्नीचर', icon: '🔨' },
        { id: 'plumber', name: 'प्लम्बर', icon: '🚰' },
        { id: 'electrician', name: 'बिजली', icon: '⚡' },
        { id: 'ac', name: 'AC रिपेयर', icon: '❄️' },
        { id: 'painting', name: 'पेंटिंग', icon: '🎨' },
        { id: 'cleaning', name: 'सफाई', icon: '🧹' },
        { id: 'civil', name: 'सिबिल वर्कर', icon: '🧱' }
    ];

    db.collection("appData").doc("serviceStatus").onSnapshot((doc) => {
        document.getElementById('loadingMsg').style.display = 'none';
        const servicesGrid = document.getElementById('servicesGrid');
        servicesGrid.innerHTML = '';
        
        // अगर डेटाबेस खाली है, तो डिफ़ॉल्ट मान लें
        let statusData = doc.exists ? doc.data() : { furniture: true }; 

        defaultServices.forEach(service => {
            const card = document.createElement('div');
            const isActive = statusData[service.id] === true;

            if (isActive) {
                card.className = 'service-card';
                card.onclick = () => { window.location.href = `booking.html?s=${service.id}`; };
                card.innerHTML = `<i>${service.icon}</i><div class="title">${service.name}</div>`;
            } else {
                card.className = 'service-card disabled';
                card.innerHTML = `<div class="coming-soon-badge">Coming Soon</div><i>${service.icon}</i><div class="title">${service.name}</div>`;
            }
            servicesGrid.appendChild(card);
        });
    });
</script>
</body>
</html>
